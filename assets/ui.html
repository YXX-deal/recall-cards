<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>recall-cards · 知识卡片管理台</title>
<style>
  :root{
    --bg:#0b0f1a; --bg2:#0f1524; --panel:#141b2d; --panel2:#1a2338; --line:#263149; --line2:#33415f;
    --txt:#e6ecf7; --dim:#93a0ba; --faint:#5f6c88;
    --acc:#6c8cff; --acc2:#4fd1c5; --warn:#ffc861; --ok:#57d9a3; --bad:#ff7a9c; --info:#7aa2ff; --purple:#b08cff;
    --hh:58px; --sbw:256px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--txt);font-family:"Microsoft YaHei","Segoe UI",sans-serif;font-size:14px;line-height:1.6;display:flex;flex-direction:column;overflow:hidden}
  body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:
      radial-gradient(900px 500px at 12% -8%, rgba(108,140,255,.16), transparent 60%),
      radial-gradient(800px 520px at 100% 0%, rgba(79,209,197,.10), transparent 55%),
      radial-gradient(700px 600px at 50% 120%, rgba(176,140,255,.10), transparent 60%),
      linear-gradient(180deg,var(--bg2),var(--bg));}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:var(--bg2)}
  ::-webkit-scrollbar-thumb{background:var(--line2);border-radius:6px;border:2px solid var(--bg2)}
  ::-webkit-scrollbar-thumb:hover{background:var(--acc)}
  *{scrollbar-width:thin;scrollbar-color:var(--line2) var(--bg2)}

  header{display:flex;align-items:center;gap:14px;height:var(--hh);flex:none;padding:0 20px;background:rgba(20,27,45,.86);
    backdrop-filter:blur(10px);border-bottom:1px solid var(--line);position:relative;z-index:6}
  .brand{display:flex;align-items:center;gap:10px;white-space:nowrap}
  .brand .mark{width:26px;height:26px;border-radius:8px;flex:none;
    background:conic-gradient(from 210deg,var(--acc),var(--acc2),var(--warn),var(--bad),var(--acc));
    box-shadow:0 0 16px rgba(108,140,255,.5)}
  .brand h1{font-size:16px;margin:0;letter-spacing:.5px}
  .brand small{display:block;color:var(--faint);font-size:11px;font-weight:400;letter-spacing:2px}
  #sb-toggle{display:none;background:var(--panel2);border:1px solid var(--line2);color:var(--txt);border-radius:8px;width:34px;height:34px;cursor:pointer;font-size:16px;flex:none}
  nav{display:flex;gap:4px;flex:none}
  nav button{position:relative;background:none;border:1px solid transparent;color:var(--dim);padding:7px 15px;border-radius:9px;cursor:pointer;font-size:14px;white-space:nowrap;transition:.18s}
  nav button:hover{color:var(--txt);background:var(--panel2)}
  nav button.on{background:var(--panel2);border-color:var(--line2);color:var(--txt);box-shadow:inset 0 -2px 0 var(--acc)}
  nav button .bdg{display:inline-block;min-width:17px;height:17px;line-height:17px;text-align:center;border-radius:9px;background:var(--warn);color:#2b2008;font-size:11px;font-weight:700;margin-left:5px;padding:0 4px}
  .spacer{margin-left:auto}
  #root{color:var(--faint);font-size:12px;max-width:24vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .switch{display:flex;align-items:center;gap:6px;color:var(--dim);font-size:12px;white-space:nowrap;cursor:pointer}
  .switch input{width:auto;accent-color:var(--acc)}

  .shell{display:flex;flex:1;min-height:0}
  aside#sidebar{width:var(--sbw);flex:none;background:rgba(15,21,36,.6);border-right:1px solid var(--line);overflow-y:auto;overflow-x:hidden;padding:12px 10px 24px}
  .sb-head{display:flex;align-items:center;justify-content:space-between;padding:2px 8px 10px;color:var(--faint);font-size:12px;letter-spacing:1px}
  .iconbtn{background:var(--panel2);border:1px solid var(--line2);color:var(--acc2);border-radius:7px;width:26px;height:26px;cursor:pointer;font-size:15px;line-height:1;transition:.16s}
  .iconbtn:hover{border-color:var(--acc2);transform:translateY(-1px)}
  .sb-all{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:9px;cursor:pointer;color:var(--dim);font-size:13px;transition:.16s;margin-bottom:4px}
  .sb-all:hover{background:var(--panel2);color:var(--txt)}
  .sb-all.on{background:linear-gradient(180deg,#22304d,#1a2338);color:#fff;box-shadow:inset 0 0 0 1px rgba(108,140,255,.3)}
  .sb-all .n,.tnode .n{margin-left:auto;font-size:11px;color:var(--faint);background:var(--bg2);border-radius:7px;padding:0 6px;line-height:16px}
  .sb-all.on .n,.tnode.on .n{color:var(--acc2)}
  .tnode{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:8px;cursor:pointer;color:var(--dim);font-size:13px;transition:.14s;position:relative}
  .tnode:hover{background:var(--panel2);color:var(--txt)}
  .tnode.on{background:linear-gradient(180deg,#1d3a3a,#16283a);color:#fff;box-shadow:inset 0 0 0 1px rgba(79,209,197,.3)}
  .tnode.ancestor{color:var(--acc2)}
  .tnode .caret{width:14px;flex:none;font-size:9px;color:var(--faint);transition:transform .16s;text-align:center;cursor:pointer}
  .tnode .caret.open{transform:rotate(90deg)}
  .tnode .caret.leaf{visibility:hidden}
  .tnode .fic{flex:none;font-size:13px}
  .tnode .tname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tnode .tacts{display:none;gap:2px;margin-left:4px}
  .tnode:hover .tacts{display:flex}
  .tnode:hover .n{display:none}
  .tacts button{background:none;border:none;color:var(--faint);cursor:pointer;font-size:12px;padding:2px 3px;border-radius:5px;line-height:1}
  .tacts button:hover{color:var(--txt);background:var(--line)}
  .tacts button[data-fdel]:hover{color:var(--bad)}
  #scrim{display:none;position:fixed;inset:var(--hh) 0 0;background:rgba(5,8,15,.6);z-index:5}

  main{flex:1;min-width:0;overflow-y:auto;padding:20px 24px 60px}
  .inner{max-width:1060px;margin:0 auto}
  .crumb{display:flex;align-items:center;gap:6px;flex-wrap:wrap;color:var(--faint);font-size:13px;margin-bottom:16px}
  .crumb a{color:var(--dim);cursor:pointer;text-decoration:none;padding:2px 7px;border-radius:6px;transition:.14s}
  .crumb a:hover{color:var(--acc);background:var(--panel2)}
  .crumb .sep{color:var(--line2)}
  .crumb .cur{color:var(--acc2);font-weight:600;padding:2px 7px}

  .bar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
  input,textarea,select{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:9px 11px;font-size:14px;font-family:inherit;width:100%;transition:.18s}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px rgba(108,140,255,.18)}
  select{width:auto;cursor:pointer}
  .bar input#q{flex:1;min-width:180px}
  .btn{background:linear-gradient(180deg,#7d99ff,var(--acc));border:none;color:#fff;padding:9px 17px;border-radius:9px;cursor:pointer;font-size:14px;white-space:nowrap;transition:.18s;box-shadow:0 2px 10px rgba(108,140,255,.3)}
  .btn:hover{filter:brightness(1.1);transform:translateY(-1px)}
  .btn:active{transform:translateY(0)}
  .btn.ghost{background:var(--panel2);border:1px solid var(--line2);color:var(--txt);box-shadow:none}
  .btn.ghost:hover{border-color:var(--acc)}
  .btn.danger{background:#3a2030;border:1px solid #5c2b44;color:var(--bad);box-shadow:none}
  .btn.ok{background:#1d3a2f;border:1px solid #2b5c44;color:var(--ok);box-shadow:none}
  .btn.ok:hover{border-color:var(--ok)}
  .btn.warn{background:#3a3220;border:1px solid #5c4d2b;color:var(--warn);box-shadow:none}
  .btn.teal{background:#163a3a;border:1px solid #2b5c54;color:var(--acc2);box-shadow:none}
  .btn.teal:hover{border-color:var(--acc2)}
  .btn.sm{padding:4px 11px;font-size:12px;border-radius:7px}

  .tray{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:linear-gradient(90deg,rgba(255,200,97,.14),rgba(255,200,97,.04));
    border:1px solid #5c4d2b;border-radius:12px;padding:12px 16px;margin-bottom:16px}
  .tray .ic{font-size:18px}
  .tray b{color:var(--warn)}
  .tray p{margin:0;color:var(--dim);font-size:13px;flex:1;min-width:200px}

  .bulkbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:linear-gradient(90deg,rgba(108,140,255,.18),rgba(79,209,197,.08));
    border:1px solid var(--line2);border-radius:12px;padding:10px 16px;margin-bottom:14px;animation:pop .2s ease}
  .bulkbar b{color:var(--acc)}
  .bulkbar .sp{margin-left:auto}

  .row{display:flex;gap:12px;align-items:flex-start;background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:12px;padding:13px 17px;margin-bottom:10px;cursor:pointer;transition:.18s}
  .row:hover{border-color:var(--acc);transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.35)}
  .row.draft{border-style:dashed;border-color:#5c4d2b}
  .row.sel{border-color:var(--acc2);box-shadow:inset 0 0 0 1px rgba(79,209,197,.4)}
  .row .pick{flex:none;margin-top:3px;width:16px;height:16px;accent-color:var(--acc2);cursor:pointer}
  .row .rc{flex:1;min-width:0}
  .row h3{margin:0 0 7px;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .row .mo{color:var(--dim);font-size:12px;margin-top:7px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .acts{margin-left:auto;display:flex;gap:6px}
  .chip{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:1px 9px;font-size:12px;color:var(--dim);margin-right:6px}
  .chip.cat{font-weight:600}
  .chip.cat::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:currentColor;margin-right:5px;vertical-align:1px}
  .chip.folder{color:var(--acc2);border-color:#2b5c54;background:rgba(79,209,197,.1)}
  .chip.draft{color:var(--warn);border-color:#5c4d2b;background:rgba(255,200,97,.1)}
  .chip.due{color:var(--warn);border-color:#5c4d2b}
  .meta{color:var(--dim);font-size:12px;margin:8px 0}
  .banner{background:rgba(255,200,97,.08);border:1px solid #5c4d2b;border-left:3px solid var(--warn);border-radius:10px;padding:10px 14px;color:var(--warn);margin:12px 0;line-height:1.7}
  .banner.teal{border-left-color:var(--acc2);color:var(--acc2);background:rgba(79,209,197,.08);border-color:#2b5c54}
  .sec{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 17px;margin-bottom:10px}
  .sec h4{margin:0 0 9px;font-size:13px;color:var(--dim);letter-spacing:1px}
  .sec .body{white-space:pre-wrap;line-height:1.9}
  .linkchip{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:4px 11px;margin:0 8px 8px 0;font-size:13px;transition:.16s}
  .linkchip:hover{border-color:var(--acc)}
  .linkchip .lt{cursor:pointer;color:var(--txt);text-decoration:none;border-bottom:1px dashed var(--line2)}
  .linkchip .lt:hover{color:var(--acc);border-bottom-color:var(--acc)}
  .linkchip button{background:none;border:none;color:var(--bad);cursor:pointer;font-size:15px;padding:0;line-height:1}
  .rel{color:var(--acc2);font-size:12px}
  .log{color:var(--dim);font-size:12px;line-height:1.9;white-space:pre-wrap}
  .qline{color:var(--dim);font-size:13px;margin:2px 0 10px;line-height:1.7}
  .linkrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .linkrow select{flex:1;min-width:120px}

  .sched{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 12px}
  .sched .kv{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:7px 12px;font-size:12px;color:var(--dim)}
  .sched .kv b{display:block;font-size:16px;color:var(--txt)}
  .curve-wrap{display:flex;gap:16px;flex-wrap:wrap;align-items:center}
  .curve-cap{color:var(--dim);font-size:12px;line-height:1.8;flex:1;min-width:200px}
  .curve-cap b{color:var(--acc2)}

  #modal{position:fixed;inset:0;background:rgba(5,8,15,.72);backdrop-filter:blur(3px);display:none;align-items:flex-start;justify-content:center;z-index:20;overflow:auto;padding:40px 16px}
  #modal .box{background:var(--panel);border:1px solid var(--line2);border-radius:14px;padding:22px;width:660px;max-width:100%;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:pop .2s ease}
  #modal .box.narrow{width:440px}
  @keyframes pop{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
  #modal label{display:block;color:var(--dim);font-size:12px;margin:11px 0 4px}
  #modal .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  #modal .hint{color:var(--faint);font-size:12px;margin-top:6px;line-height:1.7}
  .mv-sugs{display:none;max-height:190px;overflow-y:auto;margin-top:5px;border:1px solid var(--line);border-radius:8px;background:var(--panel2)}
  .mv-sug{padding:6px 11px;font-size:13px;color:var(--dim);cursor:pointer;border-bottom:1px solid var(--line);transition:.12s}
  .mv-sug:last-child{border-bottom:none}
  .mv-sug:hover{background:rgba(108,140,255,.16);color:var(--txt)}
  .mv-none{padding:8px 11px;font-size:12px;color:var(--faint)}

  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
  .stat{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:12px;padding:15px}
  .stat b{display:block;font-size:27px;margin-bottom:3px}
  .stat span{color:var(--dim);font-size:12px}
  .dist{display:flex;align-items:center;gap:10px;margin-bottom:9px}
  .dist .t{width:150px;color:var(--dim);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dist .b{height:11px;border-radius:6px;min-width:3px;transition:width .4s}
  .dist .n{color:var(--dim);font-size:12px}

  #quiz .q{font-size:17px;line-height:1.8;margin:14px 0}
  #quiz .grades{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
  .grade{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:92px}
  .grade .iv{font-size:11px;color:var(--faint)}
  #toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--panel2);border:1px solid var(--acc);border-radius:10px;padding:10px 16px;display:none;z-index:30;box-shadow:0 8px 30px rgba(0,0,0,.4);opacity:0;transition:.25s;align-items:center;gap:14px;max-width:90vw}
  #toast.show{display:flex;opacity:1;transform:translateX(-50%) translateY(0)}
  #toast .tmsg{font-size:13px}
  #toast button{background:var(--acc);border:none;color:#fff;border-radius:7px;padding:4px 12px;font-size:12px;cursor:pointer;white-space:nowrap}
  iframe{width:100%;height:calc(100vh - var(--hh) - 96px);border:1px solid var(--line);border-radius:12px;background:var(--bg)}
  .empty{color:var(--dim);text-align:center;padding:60px 0;line-height:2}
  details{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 17px;margin-bottom:10px}
  summary{cursor:pointer;color:var(--dim);font-size:13px}
  h2{font-size:20px}
  @media(max-width:760px){
    #sb-toggle{display:block}
    .brand small{display:none}
    #root{display:none}
    .switch span{display:none}
    nav{overflow-x:auto}
    aside#sidebar{position:fixed;top:var(--hh);left:0;bottom:0;z-index:6;transform:translateX(-100%);transition:transform .22s ease;box-shadow:0 0 40px rgba(0,0,0,.5)}
    aside#sidebar.open{transform:translateX(0)}
    #scrim.show{display:block}
    main{padding:16px 14px 60px}
    .dist .t{width:100px}
  }
</style>
</head>
<body>
<header>
  <button id="sb-toggle" title="文件夹">☰</button>
  <div class="brand"><span class="mark"></span><div><h1>recall-cards</h1><small>知识卡片 · 主动回忆</small></div></div>
  <nav>
    <button data-tab="cards" class="on">卡片<span class="bdg" id="draftbadge" style="display:none"></span></button>
    <button data-tab="review">复习</button>
    <button data-tab="graph">图谱</button>
    <button data-tab="stats">统计</button>
  </nav>
  <span class="spacer"></span>
  <span id="root"></span>
</header>
<div class="shell">
  <aside id="sidebar"></aside>
  <main id="main"></main>
</div>
<div id="scrim"></div>
<div id="modal"><div class="box" id="modalbox"></div></div>
<div id="toast"></div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let CARDS = [], FOLDERS = [], TODAY = '', TAB = 'cards', FOLDER = '';
const EXPANDED = new Set(), SELECTED = new Set();
const FILTER = { q: '', cat: '', status: '', sort: 'due' };
let quiz = null, curveUid = 0;
const byId = id => CARDS.find(c => c.id === id);
const folderOf = c => (c.folder && String(c.folder).trim()) || '默认';
const isUnder = (f, p) => !p || f === p || f.startsWith(p + '/');
const isDue = c => c.status !== 'draft' && (!c.review?.due || c.review.due <= TODAY);
const scopedCards = () => CARDS.filter(c => isUnder(folderOf(c), FOLDER));
const PALETTE = ['#6c8cff','#4fd1c5','#ffc861','#ff7a9c','#b08cff','#57d9a3','#ff9f6c','#7aa2ff'];
const catList = () => [...new Set(CARDS.map(c => c.category || '未分类'))].sort((a,b)=>a.localeCompare(b,'zh'));
const scopedCats = () => [...new Set(scopedCards().map(c => c.category || '未分类'))].sort((a,b)=>a.localeCompare(b,'zh'));
const catColor = name => PALETTE[Math.max(0,catList().indexOf(name)) % PALETTE.length];
const catChip = name => { const col = catColor(name); return `<span class="chip cat" style="color:${col};border-color:${col}66;background:${col}1a">${esc(name)}</span>`; };
const folderChip = name => `<span class="chip folder">📁 ${esc(name)}</span>`;
const daysText = n => n === 1 ? '明天' : n + ' 天后';

async function api(method, path, body) {
  const opt = { method };
  if (body !== undefined) { opt.headers = { 'Content-Type': 'application/json' }; opt.body = JSON.stringify(body); }
  const r = await fetch(path, opt);
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.status);
  return j;
}
function toast(msg, actionLabel, actionFn) {
  const t = $('#toast');
  t.innerHTML = `<span class="tmsg">${esc(msg)}</span>` + (actionLabel ? `<button id="toast-act">${esc(actionLabel)}</button>` : '');
  t.classList.add('show');
  if (actionLabel) $('#toast-act').addEventListener('click', async () => { t.classList.remove('show'); clearTimeout(t._h); await actionFn(); });
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), actionLabel ? 7000 : 2400);
}
async function load() {
  const s = await api('GET', '/api/state');
  CARDS = s.cards; TODAY = s.today; $('#root').textContent = s.root;
  FOLDERS = (await api('GET', '/api/folders')).folders;
  const d = CARDS.filter(c => c.status === 'draft').length;
  const b = $('#draftbadge'); b.style.display = d ? 'inline-block' : 'none'; b.textContent = d;
  if (FOLDER && !FOLDERS.some(f => f.path === FOLDER)) FOLDER = '';
  for (const id of [...SELECTED]) if (!byId(id)) SELECTED.delete(id);
  renderSidebar();
}

// ---- 文件夹树 sidebar ----
function buildTree() {
  const map = {}, roots = [];
  const sorted = [...FOLDERS].sort((a,b)=>a.path.localeCompare(b.path,'zh'));
  for (const f of sorted) map[f.path] = { ...f, children: [] };
  for (const f of sorted) {
    const node = map[f.path];
    const pp = f.path.includes('/') ? f.path.slice(0, f.path.lastIndexOf('/')) : null;
    if (pp && map[pp]) map[pp].children.push(node); else roots.push(node);
  }
  return roots;
}
function treeNodeHTML(node) {
  const hasKids = node.children.length > 0;
  const open = EXPANDED.has(node.path);
  const sel = FOLDER === node.path;
  const ancestor = !sel && isUnder(FOLDER, node.path);
  const pad = 6 + (node.depth - 1) * 15;
  const del = node.path === '默认' ? '' : `<button data-fdel="${esc(node.path)}" title="删除文件夹">🗑</button>`;
  return `<div class="tnode ${sel?'on':''} ${ancestor?'ancestor':''}" data-select="${esc(node.path)}" style="padding-left:${pad}px">
      <span class="caret ${hasKids?'':'leaf'} ${open?'open':''}" data-caret="${esc(node.path)}">▶</span>
      <span class="fic">${hasKids&&open?'📂':'📁'}</span>
      <span class="tname" title="${esc(node.path)}">${esc(node.name)}</span>
      <span class="n">${node.total}</span>

  $('#modalbox').innerHTML = `<h3 style="margin:0 0 6px">${isRename?'重命名 / 移动文件夹':'新建文件夹'}</h3>

    <input id="fm-path" value="${esc(path)}" placeholder="如 华为安全认证/单包攻击">
    ${isRename
      ? `<div class="hint">当前「${esc(path)}」下有 ${node?node.total:0} 张卡片，会随路径一起移动。</div>`
      : `<div class="hint">可一次创建多级路径，父级会自动补全。${FOLDER?`<button type="button" class="btn ghost sm" id="fm-fill" style="margin-left:6px">填入当前文件夹「${esc(FOLDER)}」作为父级</button>`:''}</div>`}
    <div class="acts"><button class="btn ghost" id="fm-cancel">取消</button><button class="btn" id="fm-ok">${isRename?'保存':'创建'}</button></div>`;
  $('#modal').style.display = 'flex';

  $('#fm-ok').addEventListener('click', async () => {
    const val = $('#fm-path').value.trim();
    if (!val) return toast('路径不能为空');
    try {
      if (isRename) {
        const r = await api('POST', '/api/folder/rename', { from: path, to: val });
        if (isUnder(FOLDER, path)) FOLDER = r.path + FOLDER.slice(path.length);
        toast(`已重命名，${r.changed} 张卡片随迁`);
      } else {
        const r = await api('POST', '/api/folder/create', { path: val });

async function deleteFolder(path) {
  const node = FOLDERS.find(f => f.path === path);
  const parent = path.includes('/') ? path.slice(0, path.lastIndexOf('/')) : '默认';
  if (!confirm(`删除文件夹「${path}」？\n其中 ${node?node.total:0} 张卡片将移到上级「${parent}」，卡片本身不会丢失。`)) return;
  try {
    const r = await api('POST', '/api/folder/delete', { path });
    if (isUnder(FOLDER, path)) FOLDER = r.movedTo === '默认' ? '' : r.movedTo;
    toast(`文件夹已删除，${r.moved} 张卡片移到「${r.movedTo}」`);
    await load(); RENDER[TAB]();
  } catch (e) { toast(e.message); }
}

function sortCards(list) {
  const s = FILTER.sort;
  const arr = list.slice();
  if (s === 'created') arr.sort((a,b)=>(b.created||'').localeCompare(a.created||'') || b.id.localeCompare(a.id));
  else if (s === 'title') arr.sort((a,b)=>(a.title||'').localeCompare(b.title||'','zh'));
  else if (s === 'reps') arr.sort((a,b)=>Number(b.review?.reps||0)-Number(a.review?.reps||0));
  else arr.sort((a,b)=>(a.review?.due||'9999').localeCompare(b.review?.due||'9999'));
  return arr;
}

  let list = FILTER.q ? (await api('GET', '/api/search?q=' + encodeURIComponent(FILTER.q))).results : scopedCards();
  if (FOLDER) list = list.filter(c => isUnder(folderOf(c), FOLDER));
  if (FILTER.cat) list = list.filter(c => (c.category||'未分类') === FILTER.cat);
  if (FILTER.status) list = list.filter(c => c.status === FILTER.status);
  return sortCards(list);
}

// ---- 详情 ----
function curveSVG(review) {
  const uid = 'cg' + (curveUid++);
  const interval = Number(review?.interval || 0);
  const S = Math.max(1, interval || 1);
  const nextIn = Math.max(1, interval || 1);
  const W=340,H=140,pL=34,pR=14,pT=14,pB=26;
  const Tmax = nextIn*2.2;
  const X = t => pL + (t/Tmax)*(W-pL-pR);
  const Y = r => (H-pB) - r*(H-pT-pB);
  let path='', area='';
  for (let i=0;i<=60;i++){ const t=Tmax*i/60; const r=Math.exp(-t/S); const x=X(t).toFixed(1), y=Y(r).toFixed(1);
    path += (i?'L':'M')+x+' '+y+' '; }
  area = `M${X(0).toFixed(1)} ${Y(0).toFixed(1)} ` + path.replace(/^M/,'L') + `L${X(Tmax).toFixed(1)} ${Y(0).toFixed(1)} Z`;
  const rx=X(nextIn), ry=Y(Math.exp(-nextIn/S));
  const ret=Math.round(Math.exp(-nextIn/S)*100);
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="遗忘曲线">
    <defs><linearGradient id="${uid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6c8cff" stop-opacity=".38"/><stop offset="1" stop-color="#4fd1c5" stop-opacity=".03"/></linearGradient>
      <linearGradient id="${uid}s" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6c8cff"/><stop offset="1" stop-color="#4fd1c5"/></linearGradient></defs>
    <line x1="${pL}" y1="${Y(0)}" x2="${W-pR}" y2="${Y(0)}" stroke="#263149"/>
    <line x1="${pL}" y1="${pT}" x2="${pL}" y2="${Y(0)}" stroke="#263149"/>
    <text x="${pL-6}" y="${Y(1)+4}" fill="#5f6c88" font-size="9" text-anchor="end">100%</text>
    <text x="${pL-6}" y="${Y(0)+3}" fill="#5f6c88" font-size="9" text-anchor="end">0</text>
    <text x="${pL-6}" y="${pT+2}" fill="#5f6c88" font-size="9" text-anchor="end" transform="rotate(-90 ${pL-14} ${(pT+Y(0))/2})">保持率</text>
    <path d="${area}" fill="url(#${uid})"/>
    <path d="${path}" fill="none" stroke="url(#${uid}s)" stroke-width="2.2"/>
    <line x1="${rx}" y1="${pT}" x2="${rx}" y2="${Y(0)}" stroke="#ffc861" stroke-width="1" stroke-dasharray="3 3"/>
    <circle cx="${rx}" cy="${ry}" r="4" fill="#ffc861"/>
    <text x="${rx}" y="${pT+8}" fill="#ffc861" font-size="10" text-anchor="middle">复习</text>
    <text x="${rx}" y="${Y(0)+16}" fill="#93a0ba" font-size="9" text-anchor="middle">${nextIn}天</text>
    <text x="${W-pR}" y="${Y(0)+16}" fill="#5f6c88" font-size="9" text-anchor="end">天数</text>
  </svg>`;
}

      <div class="linkrow">
        <select id="addlink"><option value="">选择卡片…</option>${options}</select>
        <select id="reltype"><option>相关</option><option>前置</option><option>对比</option><option>应用</option></select>
        <button class="btn ghost" id="addlinkbtn">添加</button>
      </div></div>
    <details><summary>复习记录</summary><div class="log">${esc(c.log || '（暂无）')}</div></details></div>`;
  bindCrumb();
  $('#back').addEventListener('click', renderList);
  $('#move').addEventListener('click', () => openMove([id]));
  $('#edit').addEventListener('click', () => openForm(c));
  const cf = $('#confirm');
  if (cf) cf.addEventListener('click', async () => {
    await api('POST', '/api/confirm', { id });
    await load(); toast('已确认入库，开始进入复习'); renderDetail(id);
  });
  $('#del').addEventListener('click', async () => {
    if (!confirm(`删除卡片《${c.title}》？其关联会被一并清理，可在提示里撤销。`)) return;
    const r = await api('DELETE', '/api/card?id=' + encodeURIComponent(id));
    await load(); toast('已删除《' + c.title + '》', '撤销', async () => {
      try { await api('POST', '/api/restore', { card: r.snapshot }); await load(); renderDetail(id); toast('已恢复'); }
      catch (e) { toast(e.message); await load(); renderList(); }
    });
    renderList();
  });
  document.querySelectorAll('[data-goto]').forEach(a => a.addEventListener('click', e => { e.stopPropagation(); renderDetail(a.dataset.goto); }));
  document.querySelectorAll('[data-unlink]').forEach(b => b.addEventListener('click', async e => {
    e.stopPropagation();
    await api('POST', '/api/unlink', { a: id, b: b.dataset.unlink });
    await load(); renderDetail(id); toast('已解除关联');
  }));
  $('#addlinkbtn').addEventListener('click', async () => {
    const b = $('#addlink').value;
    if (!b) return toast('先选择要关联的卡片');
    await api('POST', '/api/link', { a: id, b, note: $('#reltype').value });
    await load(); renderDetail(id); toast('已建立关联');
  });
}

// ---- 新建 / 编辑 ----
function openForm(c, presetFolder) {
  const v = k => esc(c ? (c[k] ?? '') : '');
  const arr = k => esc(c ? (c[k] || []).join(', ') : '');
  const cats = catList();
  const paths = FOLDERS.map(f=>f.path);
  const curFolder = c ? folderOf(c) : (presetFolder || FOLDER || '默认');
  $('#modalbox').className = 'box';
  $('#modalbox').innerHTML = `<h3 style="margin:0 0 6px">${c ? '编辑卡片' : '新建卡片'}</h3>
    <label>标题 *</label><input id="f-title" value="${v('title')}">
    <label>文件夹（多级路径用 / 分隔，可输入新路径）</label>
    <input id="f-folder" list="folderlist" value="${esc(curFolder)}" placeholder="如 计算机网络/数据链路层/STP">
    <datalist id="folderlist">${paths.map(x=>`<option value="${esc(x)}">`).join('')}</datalist>
    <label>大类（图谱按此上色，可输入新大类）</label>
    <input id="f-category" list="catlist" value="${v('category')}" placeholder="如 网络安全 / 园区网络 / 操作系统">
    <datalist id="catlist">${cats.map(x=>`<option value="${esc(x)}">`).join('')}</datalist>
    <label>标签（逗号分隔）</label><input id="f-tags" value="${arr('tags')}">
    <label>检索词（逗号分隔，含同义词/英文缩写）</label><input id="f-keywords" value="${arr('keywords')}">
    <label>当时为什么问（一句话，含场景）</label><input id="f-motivation" value="${v('motivation')}">
    <label>来源</label><input id="f-source" value="${v('source')}">
    <label>问题（原样记录当时的问句）</label><textarea id="f-question" rows="2">${v('question')}</textarea>
    <label>答案（纯文本要点，≤6 行，不用 ** 等记号）</label><textarea id="f-answer" rows="6">${v('answer')}</textarea>
    <div class="acts"><button class="btn ghost" id="cancel">取消</button><button class="btn" id="save">保存</button></div>`;
  $('#modal').style.display = 'flex';
  $('#cancel').addEventListener('click', closeModal);
  $('#save').addEventListener('click', async () => {
    const payload = {
      id: c ? c.id : undefined,
      title: $('#f-title').value, folder: $('#f-folder').value, category: $('#f-category').value,
      tags: $('#f-tags').value.split(/[,，]/), keywords: $('#f-keywords').value.split(/[,，]/),
      motivation: $('#f-motivation').value, source: $('#f-source').value,
      question: $('#f-question').value, answer: $('#f-answer').value
    };
    try {
      const r = await api('POST', '/api/card', payload);
      closeModal(); await load(); toast(c ? '已保存' : '已创建 ' + r.id);
      renderDetail(r.id);
    } catch (e) { toast(e.message); }
  });
}
function closeModal() { $('#modal').style.display = 'none'; }
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });

// ---- 复习 ----
async function renderReview() {
  if (quiz) return renderQuiz();
  const d = await api('GET', '/api/due');
  const cards = d.cards.filter(c => isUnder(folderOf(c), FOLDER));
  $('#main').innerHTML = `<div class="inner">${crumbHTML()}${cards.length ? `
    <div class="banner teal">今日到期 ${cards.length} 张${FOLDER?`（文件夹「${esc(FOLDER)}」及子级）`:''}（仅已入库卡片）。先回想"当时为什么问"再作答；系统按遗忘曲线为每张卡动态调整下次间隔。</div>
    <div class="bar"><button class="btn" id="start">开始复习</button></div>
    ${cards.map(c=>rowHTML(c,false)).join('')}`
    : `<div class="empty">今天没有到期的卡片${FOLDER?`（文件夹「${esc(FOLDER)}」）`:''}。<br>${nextDueText()}</div>`}</div>`;
  bindCrumb(); bindRows();
  const s = $('#start');
  if (s) s.addEventListener('click', () => { quiz = { cards, i: 0, tally: { good: 0, hard: 0, forgot: 0, skip: 0 }, revealed: false }; renderQuiz(); });
}
function nextDueText() {
  const fut = scopedCards().filter(c=>c.status!=='draft').map(c => c.review?.due).filter(Boolean).sort();
  return fut.length ? '下次到期：' + esc(fut[0]) : '库里还没有已入库的卡片。';
}
function renderQuiz() {
  const { cards, i, tally, revealed } = quiz;
  if (i >= cards.length) {
    $('#main').innerHTML = `<div class="inner"><div class="empty" style="font-size:16px">复习完成：${cards.length} 张<br>
      记得 ${tally.good} · 模糊 ${tally.hard} · 忘了 ${tally.forgot} · 跳过 ${tally.skip}</div>
      <div class="bar" style="justify-content:center"><button class="btn ghost" id="done">返回</button></div></div>`;
    $('#done').addEventListener('click', async () => { quiz = null; await load(); renderReview(); });
    return;
  }
  const c = cards[i];
  const pv = c.preview || { good: 1, hard: 1, forgot: 1 };
  const gradeBtn = (g, cls, label, iv) => `<div class="grade"><button class="btn ${cls}" data-g="${g}">${label}</button><span class="iv">${iv}</span></div>`;
  $('#main').innerHTML = `<div class="inner"><div id="quiz">
    <div class="meta">第 ${i + 1} / ${cards.length} 张 · ${esc(c.title)} · ${folderChip(folderOf(c))} ${esc(c.category||'')}</div>
    <div class="banner">当时为什么问：${esc(c.motivation || '未记录')}</div>
    <div class="q">${esc(c.question)}</div>
    ${revealed ? `<div class="sec"><h4>答案</h4><div class="body">${esc(c.answer)}</div></div>
      <div class="curve-wrap" style="margin:10px 0">${curveSVG(c.review)}<div class="curve-cap">忘了会打回 1 天重学；记得则按遗忘曲线把间隔拉长。下方按钮已标出各档评定后的<b>下次间隔</b>。</div></div>
      <div class="grades">
        ${gradeBtn('good','ok','记得','→ '+daysText(pv.good))}
        ${gradeBtn('hard','warn','模糊','→ '+daysText(pv.hard))}
        ${gradeBtn('forgot','danger','忘了','→ '+daysText(pv.forgot))}
        ${gradeBtn('skip','ghost','跳过','不改间隔')}
      </div>` : '<div class="bar"><button class="btn" id="reveal">先自己回想，再显示答案</button></div>'}
  </div></div>`;
  const r = $('#reveal');
  if (r) r.addEventListener('click', () => { quiz.revealed = true; renderQuiz(); });
  document.querySelectorAll('[data-g]').forEach(b => b.addEventListener('click', async () => {
    const g = b.dataset.g;
    await api('POST', '/api/record', { id: c.id, result: g });
    quiz.tally[g]++; quiz.i++; quiz.revealed = false;
    await load(); renderQuiz();
  }));
}

// ---- 图谱 / 统计 ----
function renderGraph() {
  const src = '/graph' + (FOLDER ? '?folder=' + encodeURIComponent(FOLDER) : '');
  $('#main').innerHTML = `<div class="inner">${crumbHTML()}<iframe src="${src}" title="知识图谱"></iframe></div>`;
  bindCrumb();
}
function localStats() {
  const cards = scopedCards();
  const tagCount = {}, catCount = {};
  for (const c of cards) {
    for (const t of c.tags||[]) tagCount[t] = (tagCount[t]||0)+1;
    const cat = c.category||'未分类'; catCount[cat] = (catCount[cat]||0)+1;
  }
  const edgeSet = new Set();
  for (const c of cards) for (const l of c.links||[]) edgeSet.add([c.id,l].sort().join('|'));
  const d = new Date(TODAY + 'T00:00:00'); d.setDate(d.getDate()-7);
  const wk = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  return {
    total: cards.length, drafts: cards.filter(c=>c.status==='draft').length,
    dueToday: cards.filter(isDue).length, links: edgeSet.size,
    categories: Object.entries(catCount).sort((a,b)=>b[1]-a[1]),
    topTags: Object.entries(tagCount).sort((a,b)=>b[1]-a[1]).slice(0,10),
    createdLast7: cards.filter(c=>c.created>=wk).length,
    totalReps: cards.reduce((s,c)=>s+Number(c.review?.reps||0),0)
  };
}
async function renderStats() {
  const s = localStats();
  const cmax = Math.max(1, ...s.categories.map(t => t[1]));
  const tmax = Math.max(1, ...s.topTags.map(t => t[1]));
  $('#main').innerHTML = `<div class="inner">${crumbHTML()}
    ${FOLDER?`<div class="banner teal">统计范围：文件夹「${esc(FOLDER)}」及其子级</div>`:''}
    <div class="stats">
      <div class="stat"><b>${s.total}</b><span>卡片总数</span></div>
      <div class="stat"><b style="color:var(--warn)">${s.drafts}</b><span>待确认草稿</span></div>
      <div class="stat"><b style="color:var(--warn)">${s.dueToday}</b><span>今日到期</span></div>
      <div class="stat"><b style="color:var(--acc2)">${s.links}</b><span>关联条数</span></div>
      <div class="stat"><b>${s.totalReps}</b><span>累计复习次数</span></div>
      <div class="stat"><b style="color:var(--ok)">${s.createdLast7}</b><span>近 7 天新增</span></div>
    </div>
    <div class="sec"><h4>大类分布</h4>${s.categories.map(([t, n]) =>
      `<div class="dist"><span class="t">${esc(t)}</span><span class="b" style="width:${Math.round(n / cmax * 300)}px;background:${catColor(t)}"></span><span class="n">${n}</span></div>`).join('') || '<div class="meta">暂无</div>'}</div>
    <div class="sec"><h4>标签分布</h4>${s.topTags.map(([t, n]) =>
      `<div class="dist"><span class="t">${esc(t)}</span><span class="b" style="width:${Math.round(n / tmax * 300)}px;background:var(--acc)"></span><span class="n">${n}</span></div>`).join('') || '<div class="meta">暂无</div>'}</div></div>`;
  bindCrumb();
}

// ---- 导航 ----
const RENDER = { cards: renderList, review: renderReview, graph: renderGraph, stats: renderStats };
document.querySelectorAll('nav button').forEach(b => b.addEventListener('click', async () => {
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x === b));
  TAB = b.dataset.tab; quiz = null; SELECTED.clear();
  await load(); RENDER[TAB]();
}));
load().then(renderList);
</script>
</body>
